<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Cüzdan logosu">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5AD1FF"/>
      <stop offset="0.45" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#3B2BD9"/>
    </linearGradient>

    <radialGradient id="shine" cx="0.2" cy="0.05" r="0.95">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="wallet" x1="0.1" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8E9FF"/>
    </linearGradient>

    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCF2FF"/>
      <stop offset="1" stop-color="#7EC2FF"/>
    </linearGradient>

    <linearGradient id="clasp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F63F0"/>
      <stop offset="1" stop-color="#122E8C"/>
    </linearGradient>

    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>

    <clipPath id="walletClip">
      <rect x="210" y="398" width="604" height="344" rx="86"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#shine)"/>

  <circle cx="872" cy="118" r="230" fill="#6BE0FF" opacity="0.30" filter="url(#blur)"/>
  <circle cx="118" cy="936" r="250" fill="#8B5CF6" opacity="0.38" filter="url(#blur)"/>

  <ellipse cx="512" cy="772" rx="252" ry="34" fill="#0B1B5C" opacity="0.32" filter="url(#blur)"/>

  <g transform="rotate(-9 475 386)">
    <rect x="300" y="286" width="350" height="200" rx="46" fill="url(#card)"/>
    <rect x="336" y="332" width="48" height="34" rx="9" fill="#0A84FF" opacity="0.24"/>
    <rect x="336" y="378" width="134" height="10" rx="5" fill="#0A84FF" opacity="0.15"/>
    <rect x="336" y="398" width="100" height="10" rx="5" fill="#0A84FF" opacity="0.12"/>
  </g>

  <rect x="210" y="398" width="604" height="344" rx="86" fill="url(#wallet)"/>

  <g clip-path="url(#walletClip)">
    <rect x="210" y="398" width="604" height="110" fill="#FFFFFF" opacity="0.19"/>
  </g>

  <rect x="614" y="500" width="180" height="140" rx="70" fill="url(#clasp)"/>
  <rect x="614" y="500" width="180" height="140" rx="70" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3"/>
  <circle cx="704" cy="570" r="14" fill="#FFFFFF" opacity="0.92"/>
</svg>
